<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles.css">
    <title>Convert Money</title>
</head>

<body>
    <img class="logo" src="./assets/logo.gif" alt="logo">
    <main>

        <label>
            Converter <b>de</b>
            <select class="currency-from">
                <option value="real">R$ Real</option>
                <option value="dolar">US$ Dólar</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>
            </select>
        </label>

        <label>
            Converter <b>para</b>
            <select class="currency-to">
                <option value="dolar">US$ Dólar</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="real">R$ Real</option>
            </select>
        </label>

        <input type="number" class="input-currency" placeholder="Digite o valor">

        <button class="convert-button">Converter</button>

        <section class="container-result">

            <!-- ORIGEM -->
            <div>
                <img class="currency-from-img" src="./assets/brasil 2.png">
                <p class="currency-from-name">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <br>

            
            <img class="arrow" src="./assets/Vector.png" alt="seta">


            <!-- DESTINO -->
            <div>
                <img class="currency-img" src="./assets/estados-unidos (1) 1.png">
                <p class="currency-name">Dólar</p>
                <p class="currency-value">US$ 0,00</p>
            </div>

        </section>

    </main>

    <script src="./script.js"></script>
</body>

</html>
